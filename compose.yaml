services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wholesale_of_oklahoma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wholesale_of_oklahoma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
